    <script>try{if(/(?:^|[?&])from=magic(?:&|$)/.test(location.search))document.documentElement.classList.add("from-magic")}catch(e){}</script>
    <script>
      try {
        var storyFromMagic = /(?:^|[?&])from=magic(?:&|$)/.test(location.search);
        var storyUnlocked = false;
        try { storyUnlocked = sessionStorage.getItem('portfolio-audio-unlocked') === '1'; } catch (e) {}
        if (storyFromMagic) {
          try {
            sessionStorage.setItem('portfolio-audio-unlocked', '1');
            sessionStorage.setItem('storybook-preview-seen', '1');
          } catch (e) {}
          storyUnlocked = true;
        }
        if (storyUnlocked) {
          var StoryAudio = window.AudioContext || window.webkitAudioContext;
          if (StoryAudio && !window.__storyAudio) {
            var storyAudio = new StoryAudio();
            window.__storyAudio = storyAudio;
            document.documentElement.dataset.audioPrimed = 'pending';
            var storyHold = function () {
              document.documentElement.dataset.audioPrimed = storyAudio.state;
              if (storyAudio.state !== 'running' || window.__storyKeepalive) return;
              try {
                var length = Math.max(1, Math.floor(storyAudio.sampleRate * 0.25));
                var buffer = storyAudio.createBuffer(1, length, storyAudio.sampleRate);
                var data = buffer.getChannelData(0);
                for (var i = 0; i < length; i++) data[i] = (i & 1 ? 1 : -1) * 0.00002;
                var source = storyAudio.createBufferSource();
                var gain = storyAudio.createGain();
                source.buffer = buffer;
                source.loop = true;
                gain.gain.value = 1;
                source.connect(gain).connect(storyAudio.destination);
                source.start();
                window.__storyKeepalive = source;
              } catch (e) {}
            };
            var storyResume = storyAudio.resume();
            if (storyResume && storyResume.then) storyResume.then(storyHold).catch(storyHold);
            else storyHold();
          }
        }
      } catch (e) {}
    </script>

    <script>
      try {
        const arrivingFromScrapbook = sessionStorage.getItem('storybook-preview-seen') === '1';
        if (location.pathname === '/' && !location.hash && !arrivingFromScrapbook) {
          location.replace('/sketchbook/');
        } else if (arrivingFromScrapbook) {
          sessionStorage.removeItem('storybook-preview-seen');
        }
      } catch {}
    </script>
