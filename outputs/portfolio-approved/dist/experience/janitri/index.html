    <script>
      try {
        var storyFromMagic = /(?:^|[?&])from=magic(?:&|$)/.test(location.search);
        var storyUnlocked = false;
        try { storyUnlocked = sessionStorage.getItem('portfolio-audio-unlocked') === '1'; } catch (e) {}
        if (storyFromMagic) {
          try {
            sessionStorage.setItem('portfolio-audio-unlocked', '1');
            sessionStorage.setItem('storybook-preview-seen', '1');
          } catch (e) {}
          storyUnlocked = true;
        }
        if (storyUnlocked) {
          var StoryAudio = window.AudioContext || window.webkitAudioContext;
          if (StoryAudio && !window.__storyAudio) {
            var storyAudio = new StoryAudio();
            window.__storyAudio = storyAudio;
            document.documentElement.dataset.audioPrimed = 'pending';
            var storyHold = function () {
              document.documentElement.dataset.audioPrimed = storyAudio.state;
              if (storyAudio.state !== 'running' || window.__storyKeepalive) return;
              try {
                var length = Math.max(1, Math.floor(storyAudio.sampleRate * 0.25));
                var buffer = storyAudio.createBuffer(1, length, storyAudio.sampleRate);
                var data = buffer.getChannelData(0);
                for (var i = 0; i < length; i++) data[i] = (i & 1 ? 1 : -1) * 0.00002;
                var source = storyAudio.createBufferSource();
                var gain = storyAudio.createGain();
                source.buffer = buffer;
                source.loop = true;
                gain.gain.value = 1;
                source.connect(gain).connect(storyAudio.destination);
                source.start();
                window.__storyKeepalive = source;
              } catch (e) {}
            };
            var storyResume = storyAudio.resume();
            if (storyResume && storyResume.then) storyResume.then(storyHold).catch(storyHold);
            else storyHold();
          }
          var storyPath = location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
          var storyBase = location.hostname.endsWith('.github.io') && (location.pathname === '/portfolio' || location.pathname.startsWith('/portfolio/')) ? '/portfolio' : '';
          if (storyBase && storyPath.indexOf(storyBase) === 0) storyPath = storyPath.slice(storyBase.length) || '/';
          var storyClips = [];
          if (storyPath === '/') {
            storyClips.push(['audio', 'story-hello-prime', 'gateway-hello-audio', (storyBase || '') + '/assets/avatar-hello.wav']);
            storyClips.push(['audio', 'story-narration-prime', 'intro-narration-audio', 'https://d8j0ntlcm91z4.cloudfront.net/user_3HGZD0LKCjtuivCHwrpylyAJpwf/hf_20261001_210437_54bc9ee3-38d4-4a14-916d-cc21ceeddbf6.wav']);
          }
          if (storyPath === '/design-process') storyClips.push(['video', 'story-film-prime', 'think-film-video', (storyBase || '') + '/assets/how-i-think-web.mp4']);
          storyClips.forEach(function (clip) {
            if (document.getElementById(clip[1])) return;
            var el = document.createElement(clip[0]);
            el.id = clip[1];
            el.className = clip[2];
            el.preload = 'auto';
            el.playsInline = true;
            el.setAttribute('playsinline', '');
            el.setAttribute('aria-hidden', 'true');
            el.src = clip[3];
            el.loop = true;
            el.volume = 0;
            el.muted = false;
            document.documentElement.appendChild(el);
            var started = el.play();
            var mark = function () { el.dataset.storyLive = 'true'; if (el.dataset.storySpeak !== 'true') el.volume = 0; };
            if (started && started.then) started.then(mark).catch(function () {});
            else mark();
          });
        }
      } catch (e) {}
    </script>

    <script>
