<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shruti — A sketchbook story</title>
<meta name="description" content="A personal sketchbook of Shruti’s memories, small obsessions, and creative beginnings.">
<style>
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:block;
  src:url(/assets/sketchbook/instrument-serif.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:block;
  src:url(/assets/sketchbook/instrument-serif-italic.woff2) format('woff2')}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:200 600;font-display:swap;
  src:url(/assets/sketchbook/newsreader.woff2) format('woff2')}

:root{
  color-scheme:light;
  /* Shared portfolio foundations: keep scrapbook components on the same
     semantic palette, type roles, spacing rhythm, and motion timing. */
  --paper:#f5f1e9;
  --paper-light:#fbf8f1;
  --paper-deep:#ece5d9;
  --ink:#27231f;
  --graphite:#746d65;
  --ink-soft:var(--graphite);
  --ink-faint:rgba(116,109,101,.66);
  --hairline:#d8cec0;
  --terracotta:#b9644b;
  --earth:var(--terracotta);
  --display:"Newsreader","Iowan Old Style","Baskerville",Georgia,serif;
  --serif:var(--display);
  --reading:"DM Sans","Avenir Next",Avenir,sans-serif;
  --font:var(--reading);
  --mono:"DM Mono","SFMono-Regular",Consolas,monospace;
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:20px;
  --space-5:28px;
  --space-6:40px;
  --space-7:56px;
  --space-8:80px;
  --radius-control:2px;
  --ease-story:cubic-bezier(.2,.7,.2,1);
  --motion-quick:220ms;
  --motion-scene:600ms;
  --track-caps:.16em;
  --track-nav:.1em;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);font-weight:400;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit}
::selection{background:rgba(43,39,33,.85);color:var(--paper)}

/* the painted ground the whole page sits on */
.wash{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:url(/assets/sketchbook/bg-wash.jpg) center top / cover no-repeat;
  opacity:.85;
}
.wash:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(245,241,233,.25) 0%,rgba(245,241,233,.72) 58%,var(--paper) 88%);
}

/* ---------------- top bar ---------------- */
.top{
  position:fixed;top:0;left:0;right:0;z-index:500;
  display:flex;flex-direction:column;align-items:center;gap:11px;
  padding-inline:clamp(16px,4vw,48px);padding-block:18px 64px;pointer-events:none;text-align:center;
}
.top>*{pointer-events:auto}
.top:before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(245,241,233,.94),rgba(245,241,233,.7) 48%,rgba(245,241,233,0));
  -webkit-backdrop-filter:blur(14px) saturate(.95);backdrop-filter:blur(14px) saturate(.95);
  -webkit-mask-image:linear-gradient(180deg,#000 46%,transparent);
  mask-image:linear-gradient(180deg,#000 46%,transparent);
}
.top .name{
  position:relative;display:inline-block;padding:0 3px 6px;
  color:var(--earth);font:500 15px/1 var(--display);letter-spacing:.08em;
  white-space:nowrap;transition:color var(--motion-quick),transform var(--motion-quick);
}
.top .name:after{content:"";position:absolute;left:2px;right:2px;bottom:0;height:1px;background:currentColor;transform:scaleX(.72);transform-origin:center;transition:transform var(--motion-quick)}
.top .name:hover{color:var(--ink);transform:translateY(-1px)}
.top .name:hover:after{transform:scaleX(1)}
.top nav{
  display:flex;gap:clamp(14px,2vw,26px);font:10px var(--mono);align-items:center;
  letter-spacing:var(--track-nav);font-weight:400;
}
.top nav a{color:var(--ink-soft);transition:color var(--motion-quick)}
.top nav a:hover,.top nav a[aria-current]{color:var(--ink)}
.top nav .top-socials{
  display:flex;align-items:center;gap:13px;margin-left:2px;padding-left:clamp(12px,1.6vw,20px);
  border-left:1px solid var(--hairline);
}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:4px;color:var(--ink-soft);transition:color var(--motion-quick)}
.icon-btn:hover{color:var(--ink)}
.top .icon-btn svg{width:16px;height:16px;display:block}
@media (max-width:640px){
  .top{padding-inline:12px;padding-block:13px 50px;gap:8px}
  .top .name{font-size:12px}
  .top nav{gap:11px;font-size:9px}
  .top nav .top-socials{gap:9px;padding-left:10px}
  .top .icon-btn{padding:2px}
  .top .icon-btn svg{width:14px;height:14px}
}

/* ---------------- hero ---------------- */
.hero{
  position:relative;display:grid;justify-items:center;align-content:center;
  min-height:100svh;overflow-anchor:none;
  padding:clamp(78px,9svh,108px) 0 28px;
}
.botany{
  position:absolute;bottom:0;width:clamp(120px,15vw,250px);opacity:.5;
  pointer-events:none;user-select:none;z-index:0;
}
.botany.l{left:clamp(-40px,-1vw,0px);bottom:2%}
.botany.r{right:clamp(-30px,0vw,10px);bottom:-2%;width:clamp(100px,12vw,200px)}
@media (max-width:900px){.botany{display:none}}

.hero-invite{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;justify-content:space-between;gap:clamp(24px,5vw,88px);width:min(1440px,84vw);min-height:60px;margin:0 auto clamp(20px,3vh,34px)}
.hero-invite-copy{display:grid;gap:9px;justify-items:start;max-width:100%}
.invite-eyebrow{margin:0;color:var(--earth);font:10px/1.25 var(--mono);letter-spacing:.2em;text-transform:uppercase}
.hero-kicker{max-width:25ch;margin:0;color:var(--ink);font:400 clamp(32px,3.35vw,52px)/1.04 var(--display);letter-spacing:-.035em;text-align:left;text-wrap:balance}
.hero-kicker em{color:var(--earth);font-style:italic;white-space:nowrap}
.skip-story{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:8px 0;color:var(--ink-soft);
  padding-inline:14px;border:1px solid var(--earth);border-radius:var(--radius-control);
  font:10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  transition:color .22s ease,background-color .22s ease,transform .22s ease,box-shadow .22s ease}
.skip-story span{color:var(--earth);transition:transform var(--motion-quick) ease}
.skip-story:hover,.skip-story:focus-visible{color:#fffaf4;background:var(--earth);transform:translateY(-2px);box-shadow:0 7px 22px #7c3d3028}
.skip-story:hover span,.skip-story:focus-visible span{color:#fffaf4}
.skip-story:hover span{transform:translate(2px,-2px)}
.skip-story:focus-visible{outline:2px solid var(--earth);outline-offset:4px}
.skip-story{animation:meet-designer-bounce 2.8s ease-in-out infinite}
@keyframes meet-designer-bounce{
  0%,78%,100%{transform:translateY(0)}
  84%{transform:translateY(-7px)}
  89%{transform:translateY(0)}
  94%{transform:translateY(-3px)}
}
.skip-story:hover,.skip-story:focus-visible{animation-play-state:paused}

.hero-down{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);border:0;background:transparent;
  padding:10px 14px;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;
  animation:cue-breathe 2.6s ease-in-out infinite;z-index:3;
}
.hero-down:hover{animation:none;opacity:1}
@keyframes cue-breathe{0%,100%{opacity:.15}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.hero-down{animation:none;opacity:.5}.skip-story{animation:none}}

/* ---------------- sketchbook ---------------- */
.hero,.hero *{-webkit-user-select:none;-moz-user-select:none;user-select:none}
.hero img{-webkit-user-drag:none;user-drag:none}
.sb-wrap{display:grid;justify-items:center;gap:14px;width:100%;position:relative;z-index:2;transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),filter .9s ease}
.sb-stage{
  display:flex;align-items:center;justify-content:center;width:100%;
  position:relative;
  touch-action:pan-y;
}
.sb-arrow{
  flex:none;display:inline-flex;align-items:center;justify-content:center;padding:6px 2px;
  border:0;background:transparent;color:var(--ink-faint);cursor:pointer;transition:color .2s;
  -webkit-tap-highlight-color:transparent;z-index:8;
}
.sb-arrow:hover{color:var(--ink)}
.sb-arrow.right.start-cue{animation:page-start-cue 1.45s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(185,100,75,.18))}
@keyframes page-start-cue{0%,100%{color:var(--ink-faint);transform:translateX(0) scale(1)}50%{color:var(--earth);transform:translateX(5px) scale(1.14)}}
.sb-wrap.attention .sb-3d{animation:book-attention .9s cubic-bezier(.2,.75,.25,1) both}
@keyframes book-attention{
  0%,100%{transform:translate3d(0,0,0) rotate(0)}
  16%{transform:translate3d(-5px,-1px,0) rotate(-.22deg)}
  34%{transform:translate3d(4px,1px,0) rotate(.18deg)}
  52%{transform:translate3d(-3px,0,0) rotate(-.12deg)}
  70%{transform:translate3d(2px,0,0) rotate(.08deg)}
}

/* The box is the book's own untransformed frame: the loupe lives here, on
   the desk, while only .sb-tilt leans and scales underneath it. */
.sb-3d{
  position:relative;flex:0 1 auto;min-width:0;width:min(960px,97vw,calc((100svh - 280px) * 1.419));max-width:960px;
  perspective:1750px;perspective-origin:50% 50%;
}
.sb-tilt{
  position:relative;
  transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--zoom,1));
  will-change:transform;
}
.sb-book{
  position:relative;width:100%;aspect-ratio:1760/1240;transform-style:preserve-3d;z-index:1;isolation:isolate;
  background:linear-gradient(90deg,#f6f0e4 0%,#fffaf0 4%,#f6f0e4 48.9%,#ded2bd 49.7%,#c8b99e 50%,#f7f1e5 51.1%,#fffaf0 96%,#f4eddf 100%);
  border:1px solid rgba(91,69,43,.22);
  box-shadow:0 20px 34px rgba(61,45,25,.18),0 3px 0 #e8decd,0 6px 0 #fbf7ed,0 9px 0 #ded2bf,0 24px 46px rgba(61,45,25,.13);
}
.sb-book:before{
  content:"";position:absolute;inset:7px -5px -10px 5px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,#e7decd 0 49.6%,#cfc1a9 50%,#eee6d7 50.5% 100%);
  border:1px solid rgba(91,69,43,.12);box-shadow:0 9px 15px rgba(61,45,25,.10)
}
.sb-book:after{
  content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:linear-gradient(90deg,transparent 49.65%,rgba(50,36,22,.055) 49.92%,rgba(255,250,238,.24) 50.08%,transparent 50.36%);
  box-shadow:inset 0 0 0 1px rgba(255,250,240,.72),inset 0 0 0 2px rgba(74,54,31,.12),inset 0 0 0 clamp(10px,.95vw,16px) rgba(250,246,237,.76)
}
.sb-full,.sb-half{z-index:2}

/* The book sits on a surface, so its shadow is a soft pool underneath —
   no box, no filter on the artwork, nothing with an edge of its own.
   Both blobs fade to zero well inside their own bounds, and both ease
   off while a leaf is in the air. */
.sb-cast{position:absolute;pointer-events:none;z-index:0}
.sb-cast.ambient{
  left:5%;right:5%;top:27%;bottom:2%;
  background:radial-gradient(50% 50% at 50% 58%,
    rgba(58,44,26,.34) 0%,rgba(58,44,26,.19) 40%,rgba(58,44,26,0) 74%);
  filter:blur(26px);
  opacity:calc(1 - var(--shade,0) * .42);
}
.sb-cast.contact{
  left:9%;right:9%;top:62%;bottom:10%;
  background:radial-gradient(50% 44% at 50% 42%,
    rgba(44,32,14,.40) 0%,rgba(44,32,14,.17) 48%,rgba(44,32,14,0) 78%);
  filter:blur(11px);
  opacity:calc(1 - var(--shade,0) * .5);
}
.sb-cast.hair{
  left:12%;right:12%;top:70%;bottom:17%;
  background:radial-gradient(50% 52% at 50% 40%,
    rgba(40,28,10,.34) 0%,rgba(40,28,10,0) 76%);
  filter:blur(4px);
  opacity:calc(1 - var(--shade,0) * .62);
}
.sb-full{position:absolute;inset:0}
.sb-full img{width:100%;height:100%;object-fit:cover;display:block}
.sb-half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
.sb-half.left{left:0}
.sb-half.right{left:50%}
.sb-half-img{position:absolute;top:0;left:0;width:200%;max-width:none;height:100%;object-fit:cover;display:block}
.sb-half-img.right{left:-100%}
/* the shadow the lifting leaf throws onto the page beneath it */
.gutter-shade{
  position:absolute;top:var(--pg,21.8%);bottom:var(--pg,21.8%);width:46%;
  pointer-events:none;opacity:calc(var(--shade,0) * .62);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
}
.gutter-shade.left{right:0;background:linear-gradient(270deg,rgba(52,38,20,.30),rgba(52,38,20,0) 82%)}
.gutter-shade.right{left:0;background:linear-gradient(90deg,rgba(52,38,20,.24),rgba(52,38,20,0) 82%)}

/* ---- the turning leaf: nested strips forming a curved surface ---- */
.curl{
  position:absolute;top:0;height:100%;
  width:calc(var(--bw,0px) * var(--span));will-change:transform;
  transform-style:preserve-3d;z-index:6;
}
.curl.next{left:50%;transform-origin:left center;transform:rotateY(calc(-1 * var(--tt,0deg)))}
.curl.prev{right:50%;transform-origin:right center;transform:rotateY(var(--tt,0deg))}
.strip{
  position:absolute;top:0;height:100%;
  width:calc(var(--bw,0px) * var(--span) / var(--n));will-change:transform;
  transform-style:preserve-3d;
}
.curl.next .strip{transform-origin:left center}
.curl.prev .strip{transform-origin:right center}
.curl.next>.strip{left:0}
.curl.prev>.strip{right:0;left:auto}
.curl.next .strip .strip{left:100%;transform:rotateY(var(--td,0deg))}
.curl.prev .strip .strip{right:100%;transform:rotateY(calc(-1 * var(--td,0deg)))}
.face{
  position:absolute;top:0;bottom:0;left:0;right:-1.1px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background-repeat:no-repeat;background-size:var(--bw,0px) var(--bh,0px);
}
.face.back{transform:rotateY(180deg)}
.face .sh,.face .gl{
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
}
.strip.edge .face .sh,.strip.edge .face .gl{
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 9%,#000 91%,transparent 100%),var(--hf);
  mask-image:linear-gradient(180deg,transparent 0,#000 9%,#000 91%,transparent 100%),var(--hf);
  -webkit-mask-composite:source-in;mask-composite:intersect;
}
.curl.next .strip.edge .face.front,.curl.prev .strip.edge .face.back{
  --hf:linear-gradient(90deg,#000 0 22%,transparent 96%);
}
.curl.next .strip.edge .face.back,.curl.prev .strip.edge .face.front{
  --hf:linear-gradient(270deg,#000 0 22%,transparent 96%);
}
.face .sh{position:absolute;left:0;right:0;top:var(--pg,21.8%);bottom:var(--pg,21.8%);pointer-events:none}
.curl.next .face.front .sh,.curl.prev .face.back .sh{
  background:linear-gradient(90deg,rgba(58,43,20,var(--a1,0)),rgba(58,43,20,var(--a2,0)));
}
.curl.next .face.back .sh,.curl.prev .face.front .sh{
  background:linear-gradient(90deg,rgba(58,43,20,var(--a2,0)),rgba(58,43,20,var(--a1,0)));
}
.face .gl{
  position:absolute;left:0;right:0;top:var(--pg,21.8%);bottom:var(--pg,21.8%);
  pointer-events:none;background:#fffaf0;
  opacity:calc(var(--shade,0) * var(--lit,1) * var(--lit,1) * .20);
}

/* ---- the loupe: a real magnifier lying on the page.  Pick it up and
       drag it across the book; it stays where you put it. ---- */
.loupe{
  position:absolute;left:0;top:0;
  width:var(--lr,270px);height:var(--lr,270px);
  pointer-events:none;z-index:80;opacity:0;
  transition:opacity .25s ease;
  will-change:transform;
}
.loupe.on{opacity:1}
.loupe.held .ring{cursor:grabbing}
.loupe .ring{
  position:absolute;inset:0;border-radius:50%;
  pointer-events:auto;cursor:grab;
  padding:calc(var(--lr,270px) * .058);
  box-shadow:
    0 1px 2px rgba(58,44,26,.30),
    0 10px 18px rgba(58,44,26,.24),
    0 26px 40px rgba(58,44,26,.20),
    0 48px 66px rgba(58,44,26,.13);
}
/* the bezel is an annulus, so the glass really is see-through */
.loupe .ring:before{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:linear-gradient(146deg,
    #fdf7e9 0%,#e6d7b4 14%,#b69d70 32%,#7d6740 50%,
    #cdbb92 66%,#f4ead3 80%,#9b8459 100%);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(70,52,26,.5);
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 0 88.2%,#000 89.8% 100%);
  mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 0 88.2%,#000 89.8% 100%);
}
/* the handle, drawn before the bezel so the ring covers its inner end */
.loupe .grip{
  position:absolute;left:50%;top:50%;
  width:calc(var(--lr,270px) * .74);height:calc(var(--lr,270px) * .125);
  transform-origin:0 50%;
  transform:rotate(40deg) translate(calc(var(--lr,270px) * .33),-50%);
  border-radius:calc(var(--lr,270px) * .06);
  pointer-events:auto;cursor:grab;
  background:
    linear-gradient(180deg,rgba(255,255,255,.46) 0 13%,rgba(255,255,255,0) 44%,
                    rgba(0,0,0,.26) 100%),
    linear-gradient(90deg,#d9bd82 0 14%,#a9884e 14% 20%,#6d4c2b 20% 62%,
                    #5a3d22 62% 92%,#7a563180 92% 100%);
  box-shadow:0 8px 15px rgba(58,44,26,.26),0 18px 26px rgba(58,44,26,.14);
}
.lens{
  position:relative;display:block;width:100%;height:100%;border-radius:50%;
  background-repeat:no-repeat;overflow:hidden;
  box-shadow:
    inset 0 0 0 1px rgba(52,40,22,.55),
    inset 0 4px 12px rgba(40,30,14,.28),
    inset 0 -7px 16px rgba(255,250,240,.14);
}
.lens .mag{display:none}
/* A second copy of the book, sitting beside the glass outside the tilt, and
   scaled about whichever page point the glass is currently over. */
.zoomwrap{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2;
  opacity:0;
}
.zoominner{position:absolute;inset:0;transform-origin:0 0}
.lens:before,.lens:after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.lens:before{z-index:1}
.lens:after{z-index:2}
/* the glass bends and darkens toward its rim, with a faint colour fringe */
.lens:before{
  background:radial-gradient(circle at 50% 50%,
    rgba(0,0,0,0) 54%,rgba(58,44,26,.10) 76%,rgba(46,34,16,.34) 100%);
  box-shadow:
    inset 0 0 0 2px rgba(130,162,196,.26),
    inset 0 0 0 4px rgba(206,158,112,.15);
}
/* the dome: one broad specular and a tight crescent opposite it */
.lens:after{
  background:
    radial-gradient(36% 26% at 29% 19%,rgba(255,255,255,.30),rgba(255,255,255,0) 76%),
    radial-gradient(24% 16% at 74% 86%,rgba(255,255,255,.12),rgba(255,255,255,0) 80%),
    linear-gradient(150deg,rgba(255,255,255,.06) 0 18%,rgba(255,255,255,0) 42%);
}

/* ---- controls ---- */
.sb-tools{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--hairline);border-radius:999px;
  padding:5px 7px;background:rgba(250,246,238,.62);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.tool{
  width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:50%;background:transparent;color:var(--ink-soft);
  cursor:pointer;transition:background-color .18s ease,color .18s ease;
}
.tool:hover{background:rgba(255,252,244,.9);color:var(--ink)}
.tool[aria-pressed="true"]{background:rgba(154,106,62,.16);color:var(--earth)}
.tool:disabled{opacity:.32;cursor:default;background:transparent}
.tool svg{width:15px;height:15px;display:block}
.tool-sep{width:1px;height:17px;background:var(--hairline);margin:0 2px}
.zoom-read{
  font-size:11px;letter-spacing:.1em;color:var(--ink-faint);
  min-width:40px;text-align:center;font-variant-numeric:tabular-nums;
}

<script>
/* =====================================================================
   Shruti — sketchbook hero.
   Spreads are transparent PNGs of an open sketchbook generated with
   Higgsfield.  The leaf that turns is a real curved surface: a chain of
   nested strips whose tangent sweeps through an arc, so the page bends
   the way paper bends instead of pivoting like a flat door.
   ===================================================================== */
const Q=new URLSearchParams(location.search);
const DIR='/assets/sketchbook/';
const PAGES=[
  {file:'01-child-portrait.jpg', guide:'Some kids had imaginary friends. I had entire imaginary worlds.', alt:'Young Shruti draws quietly in her sketchbook at home.'},
  {file:'02-painting-start.jpg', guide:'He probably thought he was just keeping me busy. Little did he know.', alt:'Shruti’s brother introduces her to painting beside their open sketchbook.'},
  {file:'03-brother-paints-design.jpg', guide:'Paint everywhere. Absolutely no idea what we were doing. Best afternoons.', alt:'Shruti and her brother paint side by side.'},
  {file:'03-growing-eye.jpg', guide:'Someone believed I could do something with all this before I believed it myself.', alt:'A school friend encourages young Shruti as they look through her drawings.'},
  {file:'04-travel.jpg', guide:'I’ve always loved the in-between part of going somewhere.', alt:'Shruti sketches the view from a train window while travelling through a new landscape.'},
  {file:'05-basketball.jpg', guide:'I’m very easygoing. Until someone starts keeping score.', alt:'Shruti and friends pass a basketball on an outdoor court.'},
  {file:'06-dogs.jpg', guide:'I have a terrible habit of making friends I can’t bring home.', alt:'Shruti sits on the ground among friendly dogs in a sunny garden.'},
  {file:'07-friends-camera.jpg', guide:'I take the picture. Then spend the rest of the day wishing I’d been in it.', alt:'Shruti captures a candid moment with friends on her camera.'},
  {file:'08-music.jpg', guide:'One minute, Kishore Kumar. The next, The Blaze. Don’t ask me to explain.', alt:'Shruti listens to a mix of Indian classics and electronic music among her records.'},
  {file:'09-roads.jpg', guide:'Half the fun is taking the scenic route and pretending it was the plan.', alt:'Shruti rides her motorcycle along a scenic road, with a car at a nearby overlook.'},
  {file:'08-nift-arrival.jpg', guide:'For the first time, being curious about everything actually felt like a plan.', alt:'Shruti arrives at a design college with her sketchbook and camera.'},
  {file:'09-visual-language.jpg', guide:'Lots of experiments. Lots of starting over. A suspicious amount of coffee.', alt:'Shruti arranges colour, image and story studies in a creative studio.'},
  {file:'10-sant-rams.jpg', guide:'Suddenly, the things I made had to make sense to someone other than me.', alt:'Shruti develops a visual presentation for a jewellery collection.'},
  {file:'11-questions-change.jpg', guide:'I started noticing the moments when people stopped, hesitated, or got lost.', alt:'Shruti listens to someone using a digital service and begins noting questions.'},
  {file:'12-janitri.jpg', guide:'The most useful thing I brought into the room wasn’t always an idea. Sometimes, it was a question.', alt:'Shruti collaborates with a healthcare professional while reviewing a maternal-care experience.'},
  {file:'13-confident-ux.jpg', guide:'Still making things. Still asking why. Still a work in progress.', alt:'Shruti reflects at her desk, surrounded by thoughtful question marks.'}
];
PAGES.forEach(p=>p.url=DIR+p.file);
const M=PAGES.length, LAND=0;

const wrap=document.getElementById('sbWrap');
const stage=document.getElementById('sbStage');
const sb3d=document.getElementById('sb3d');
const book=document.getElementById('sbBook');
const capBox=document.getElementById('sbCaptions');
const hint=document.getElementById('sbHint');
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Match the portfolio's quiet CTA cue on this standalone story route. */
let scrapbookAudio=null,lastScrapbookControl=null;
const scrapbookCueTimes=new WeakMap();
function playScrapbookCue(control){
  if(!control)return;
  const now=performance.now();
  if(now-(scrapbookCueTimes.get(control)||0)<900)return;
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  scrapbookAudio ||= new AudioContextClass();
  const play=()=>{
    if(scrapbookAudio.state!=='running')return;
    const t=scrapbookAudio.currentTime,osc=scrapbookAudio.createOscillator(),gain=scrapbookAudio.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(740,t);osc.frequency.exponentialRampToValueAtTime(988,t+.075);
    gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.22,t+.014);gain.gain.exponentialRampToValueAtTime(.0001,t+.19);
    osc.connect(gain).connect(scrapbookAudio.destination);osc.start(t);osc.stop(t+.2);scrapbookCueTimes.set(control,now);
  };
  if(scrapbookAudio.state==='suspended')scrapbookAudio.resume().then(play).catch(()=>{});else play();
}
document.addEventListener('pointerdown',()=>{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  scrapbookAudio ||= new AudioContextClass();
  if(scrapbookAudio.state==='suspended')scrapbookAudio.resume().catch(()=>{});
},{capture:true});
document.addEventListener('pointermove',event=>{
  if(event.pointerType==='touch')return;
  const control=event.target instanceof Element?event.target.closest('.skip-story,.top nav a'):null;
  if(control!==lastScrapbookControl&&control)playScrapbookCue(control);
  lastScrapbookControl=control;
},{capture:true,passive:true});
document.addEventListener('pointerdown',event=>{
  const control=event.target instanceof Element?event.target.closest('.skip-story,.top nav a'):null;
  if(control&&!scrapbookCueTimes.has(control))playScrapbookCue(control);
},{capture:true});
document.addEventListener('focusin',event=>{
  const control=event.target instanceof Element?event.target.closest('.skip-story,.top nav a'):null;
  if(control)playScrapbookCue(control);
});
document.addEventListener('click',event=>{
  const link=event.target instanceof Element?event.target.closest('.skip-story'):null;
  if(!link||event.defaultPrevented||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
  event.preventDefault();
  window.setTimeout(()=>location.assign(link.href),240);
},{capture:true});

/* ------------------------------------------------ the turning leaf */
const N=18;            /* strips — enough for a smooth curve          */
const SPAN=0.449;      /* gutter → outer page edge, as a fraction     */
const BETA=0.60;       /* peak curl of the arc, radians              */
const FLIP_SECONDS=.60;
const PAGE_PAUSE_MS=1650;
let idx=0, turn=null;  /* turn = {dir, from, to, t}                   */
let strips=[];         /* the chain, kept for per-frame lighting       */
const decodedPages=new Array(M);
const pageLoads=new Array(M);
function ensurePageImage(i,retries=2){
  i=(i+M)%M;
  if(decodedPages[i]?.naturalWidth)return Promise.resolve(decodedPages[i]);
  if(pageLoads[i])return pageLoads[i];
  const attempt=remaining=>new Promise((resolve,reject)=>{
    const im=new __threeuiStorageImage();
    im.decoding='async';im.loading='eager';im.fetchPriority=i===idx?'high':'low';
    const failed=()=>{
      if(remaining>0){setTimeout(()=>attempt(remaining-1).then(resolve,reject),180);return;}
      reject(new Error('Could not load scrapbook page '+(i+1)));
    };
    im.onload=async()=>{
      try{if(im.decode)await im.decode();}catch{}
      if(im.naturalWidth>0){decodedPages[i]=im;resolve(im);}else failed();
    };
    im.onerror=failed;
    im.src=PAGES[i].url;
    if(im.complete&&im.naturalWidth>0)im.onload();
  });
  pageLoads[i]=attempt(retries).finally(()=>{pageLoads[i]=null;});
  return pageLoads[i];
}
function reportPageLoadError(){
  stopStory();
  const primary=hint.querySelector('.sb-hint-primary');
  if(primary)primary.textContent='This page is taking a moment to load. Try turning it again.';
}
function warmNextPage(){ensurePageImage(idx+1).catch(()=>{});}

function el(t,c){const e=document.createElement(t);if(c)e.className=c;return e}
function imgEl(i,side){
  const im=decodedPages[i]?.cloneNode(false)||new __threeuiStorageImage();im.className='sb-half-img '+side;
  im.draggable=false;im.alt=PAGES[i].alt;if(!im.src)im.src=PAGES[i].url;return im;
}

function halfEl(pos,i){
  const d=el('div','sb-half '+pos);
  d.appendChild(imgEl(i,pos));
  d.appendChild(el('div','gutter-shade '+pos));
  return d;
}
/* build the strip chain once per turn; background offsets are pure
   geometry, so they never need touching again while it animates */
function buildCurl(dir,from,to){
  strips=[];
  const c=el('div','curl '+dir);
  c.style.setProperty('--n',N);
  c.style.setProperty('--span',SPAN);
  let host=c;
  for(let i=0;i<N;i++){
    const s=el('div','strip');
    s.style.setProperty('--i',i);
    const gut='calc(var(--bw) * 0.5)';
    const sw='calc(var(--bw) * '+SPAN+' / '+N+')';
    const A='calc(-1 * ('+gut+' + '+i+' * '+sw+'))';         /* faces the from-page  */
    const B='calc('+(i+1)+' * '+sw+' - '+gut+')';            /* faces the to-page    */
    const f=el('div','face front'), b=el('div','face back');
    const dress=(e,url,px)=>{
      e.style.backgroundImage='url('+url+')';
      e.style.backgroundPositionX=px;
    };
    dress(f,PAGES[from].url, dir==='next'?A:B);
    dress(b,PAGES[to].url,   dir==='next'?B:A);
    f.appendChild(el('div','sh'));f.appendChild(el('div','gl'));
    b.appendChild(el('div','sh'));b.appendChild(el('div','gl'));
    s.appendChild(f);s.appendChild(b);
    if(i===N-1)s.classList.add('edge');
    host.appendChild(s);host=s;
    strips.push(s);
  }
  return c;
}
function applyTurn(t){
  const th=Math.PI*t;                       /* how far the leaf has swung */
  const beta=BETA*Math.sin(Math.PI*t);      /* it is flat at both ends    */
  const D=180/Math.PI;
  const tt=th+beta, td=2*beta/N;
  sb3d.style.setProperty('--tt',(tt*D).toFixed(2)+'deg');
  sb3d.style.setProperty('--td',(td*D).toFixed(3)+'deg');
  sb3d.style.setProperty('--shade',Math.sin(Math.PI*t).toFixed(3));
  fadeCaption(t);
  for(let i=0;i<strips.length;i++){
    const l1=Math.abs(Math.cos(tt-i*td));        /* facing at this strip's near edge */
    const l2=Math.abs(Math.cos(tt-(i+1)*td));    /* ...and at its far edge           */
    const st=strips[i].style;
    st.setProperty('--lit',l1.toFixed(3));
    st.setProperty('--a1',((1-l1)*.62).toFixed(3));
    st.setProperty('--a2',((1-l2)*.62).toFixed(3));
  }
}
function paint(){
  book.textContent='';
  book.classList.toggle('is-turning',Boolean(turn));
  if(!turn){
    const f=el('div','sb-full');
    const im=decodedPages[idx]?.cloneNode(false)||new __threeuiStorageImage();if(!im.src)im.src=PAGES[idx].url;im.alt=PAGES[idx].alt;
    im.draggable=false;
    f.appendChild(im);book.appendChild(f);
    sb3d.style.setProperty('--shade','0');
  }else{
    const next=turn.dir==='next';
    book.appendChild(halfEl('left', next?turn.from:turn.to));
    book.appendChild(halfEl('right',next?turn.to:turn.from));
    book.appendChild(buildCurl(turn.dir,turn.from,turn.to));
    applyTurn(turn.t);
  }
  const a=el('button','sb-zone sb-prev'),b=el('button','sb-zone sb-next');
  a.setAttribute('aria-label','Previous page');a.title='Previous page';
  b.setAttribute('aria-label','Next page');b.title='Next page';
  book.appendChild(a);book.appendChild(b);
  layout();
  caption();
  if(typeof syncZoomLayer==='function')syncZoomLayer();
  if(typeof placeLoupe==='function')placeLoupe();
  const pageIndicator=hint.querySelector('.sb-step');
  if(pageIndicator)pageIndicator.textContent=String(idx+1).padStart(2,'0')+' / '+String(M).padStart(2,'0');
  scheduleLanding();
}
function caption(){
  capBox.textContent='';

  const make=(i)=>{
    const node=el('div','sb-caption');

    node.append(guide);
    if(PAGES[i].subguide){const detail=el('span','sb-caption-detail');detail.textContent=PAGES[i].subguide;node.append(detail);}
    return node;
  };
  if(turn){
    capOut=make(turn.from);capOut.classList.add('live');capBox.appendChild(capOut);
    capIn=make(turn.to);capIn.classList.add('live');capBox.appendChild(capIn);

let capOut=null,capIn=null;
function fadeCaption(t){

     sit on top of each other mid-drag */

/* The last painted scene is the book's handoff to the portfolio. Give it a
   quiet pause, then let the page fill the view before returning home. */
let landingTimer=null,landingStarted=false;

  if(landingStarted)return;

/* ------------------------------------------------------ spring loop */
let spring=null;
function animateTo(target,onDone,stiff,damp){
  spring={kind:'spring',v:0,target:target,done:onDone,k:stiff||150,c:damp||22};
  kick();
}
/* the riffle wants a fixed tempo, not a spring settling time */
function tweenTo(target,dur,onDone){
  spring={kind:'tween',from:turn?turn.t:0,target:target,dur:dur,e:0,done:onDone};
  kick();
}
let raf=null,last=0;
function tick(now){
  raf=null;
  const dt=Math.min(0.032,(now-last)/1000||0.016);last=now;
  if(spring&&turn){
    const s=spring;
    if(s.kind==='tween'){
      s.e+=dt;
      const linear=Math.min(1,s.e/s.dur);
      const k=linear<.5?4*linear*linear*linear:1-Math.pow(-2*linear+2,3)/2;
      turn.t=s.from+(s.target-s.from)*k;
      applyTurn(turn.t);
      if(k>=1){spring=null;const d=s.done;d&&d();}
    }else{
      const x=turn.t-s.target;
      s.v+= (-s.k*x - s.c*s.v)*dt;
      turn.t+=s.v*dt;
      if(Math.abs(turn.t-s.target)<0.002&&Math.abs(s.v)<0.02){
        turn.t=s.target;spring=null;
        applyTurn(turn.t);
        const d=s.done;d&&d();
      }else applyTurn(turn.t);
    }
  }
  viewSpring();
  const lmoved=loupeEase();
  /* kick() may already have queued the next frame from a done-callback */
  if((spring||viewActive||lmoved)&&raf===null) raf=requestAnimationFrame(tick);
}
function kick(){ if(raf===null){last=performance.now();raf=requestAnimationFrame(tick);} }

/* ------------------------------------------- tilt + zoom of the book */
const TILT_X=3.2, TILT_Y=4.6;    /* quiet page response, never a wobble */
const ZOOM_MIN=0.9, ZOOM_MAX=1.5;
const view={rx:0,ry:0,z:1, trx:0,try_:0,tz:1};
let viewActive=false;
let lastZ=1;
function applyView(){
  sb3d.style.setProperty('--rx',view.rx.toFixed(2)+'deg');
  sb3d.style.setProperty('--ry',view.ry.toFixed(2)+'deg');
  sb3d.style.setProperty('--zoom',view.z.toFixed(3));
  /* the glass stays put, but the page under it has moved */
  if(view.z!==lastZ){lastZ=view.z;if(typeof placeLoupe==='function')placeLoupe();}
}
function viewSpring(){
  const e=0.14;
  let moved=false;
  for(const [k,t] of [['rx','trx'],['ry','try_'],['z','tz']]){
    const d=view[t]-view[k];
    if(Math.abs(d)>0.0006){view[k]+=d*e;moved=true;}
    else view[k]=view[t];
  }
  if(moved)applyView();
  viewActive=moved;
  return moved;
}
function setView(rx,ry,z){
  view.trx=Math.max(-TILT_X,Math.min(TILT_X,rx));
  view.try_=Math.max(-TILT_Y,Math.min(TILT_Y,ry));
  view.tz=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,z));
  viewActive=true;kick();
  if(typeof syncZoom==='function')syncZoom();
}
/* the book leans toward the cursor — no dragging, and never far */
function tiltTo(cx,cy){
  if(drag||turn||storyPlaying||hoverDir)return;   /* keep the book locked while a leaf moves */
  const r=book.getBoundingClientRect();
  if(!r.width)return;
  const nx=Math.max(-1,Math.min(1,(cx-(r.left+r.width/2))/(r.width*0.62)));
  const ny=Math.max(-1,Math.min(1,(cy-(r.top+r.height/2))/(r.height*0.9)));
  setView(-ny*TILT_X, nx*TILT_Y, view.tz);
}
addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;
  tiltTo(e.clientX,e.clientY);
},{passive:true});
addEventListener('pointerout',e=>{if(!e.relatedTarget)setView(0,0,view.tz)});
addEventListener('blur',()=>setView(0,0,view.tz));
/* the wheel belongs to the page — zoom is on the toolbar, or a double click
   to come back to 100% */
stage.addEventListener('dblclick',()=>setView(view.trx,view.try_,1));

/* ------------------------------------------------------- pointer work */
let drag=null;
function bookRect(){return book.getBoundingClientRect()}
function hideHint(){hint.classList.add('gone')}

stage.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  e.preventDefault();                     /* no text selection, no image drag */
      const onBook=e.target.closest('.sb-zone');
      stage.setPointerCapture(e.pointerId);
      hideHint();
      if(!onBook||introOn)return;
      if(storyPlaying||storyStartPending){
        stopStory();suppressHoverUntilLeave=true;
        drag=null;
        return;
      }
  const r=bookRect();
  const dir=(e.clientX-r.left)/r.width>0.5?'next':'prev';
  const target=(dir==='next'?(idx+1)%M:(idx-1+M)%M);
  if((dir==='next'&&idx>=M-1)|| (dir==='prev'&&idx<=0))return;
  if(!decodedPages[target]){
    ensurePageImage(target).then(()=>step(dir)).catch(reportPageLoadError);
    return;
  }
  startTurn(dir,0);
  drag={dir:dir,x0:e.clientX,w:r.width,moved:0,vel:0,tPrev:performance.now()};
});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x0;
  drag.moved=Math.max(drag.moved,Math.abs(dx));
  const raw=(drag.dir==='next'? -dx : dx)/(drag.w*0.62);
  const t=Math.max(0,Math.min(1,raw));
  const now=performance.now();
  drag.vel=(t-(turn?turn.t:0))/Math.max(0.001,(now-drag.tPrev)/1000);
  drag.tPrev=now;
  if(turn){turn.t=t;applyTurn(t);}
});
function endDrag(e){
  if(!drag)return;
  const d=drag;drag=null;
  if(!turn)return;
  if(d.moved<6){                              /* a tap, not a drag */
    commit();
    return;
  }
  const go = turn.t>0.42 || d.vel>1.1;
  if(go)commit(); else cancel();
}
stage.addEventListener('dragstart',e=>e.preventDefault());
stage.addEventListener('selectstart',e=>e.preventDefault());
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);

/* ------------------------------------------------------ turn control */
function startTurn(dir,t,keepPlaying,keepHover){
  if(!keepPlaying){stopStory();suppressHoverUntilLeave=true;}
  if(!keepHover)stopHoverTurns();
  if(dir==='next'&&idx===M-1&&!turn){beginLanding();return;}
  spring=null;
  if(turn){idx=turn.to;turn=null;}      /* settle anything still in flight */
  if(typeof shoveLoupe==='function')shoveLoupe(dir);
  const from=idx;
  turn={dir:dir,from:from,to:dir==='next'?(from+1)%M:(from-1+M)%M,t:t||0};
  paint();
}
function commit(){
  if(!turn)return;
  if(REDUCED){idx=turn.to;turn=null;paint();return;}
  tweenTo(1,FLIP_SECONDS,()=>{idx=turn.to;turn=null;paint();});
  kick();
}
function cancel(){
  if(!turn)return;
  tweenTo(0,.9,()=>{turn=null;paint();});
  kick();
}
async function step(dir){
  stopStory();
  if(introOn)endIntro();
  if(dir==='next'&&idx===M-1&&!turn){beginLanding();return;}
  if(dir==='prev'&&idx<=0)return;
  const expected=idx;
  const target=dir==='next'?(expected+1)%M:(expected-1+M)%M;
  try{await ensurePageImage(target);}catch{reportPageLoadError();return;}
  if(idx!==expected||storyPlaying)return;
  if(turn){ /* finish whatever is in flight first */ idx=turn.to;turn=null; }
  startTurn(dir,0);commit();
}
async function goTo(i){
  stopStory();
  if(introOn)endIntro();
  if(i===idx)return;
  const expected=idx;
  try{await ensurePageImage(i);}catch{reportPageLoadError();return;}
  if(idx!==expected)return;
  if(turn){idx=turn.to;turn=null;}
  const fwd=(i-idx+M)%M, back=(idx-i+M)%M;
  if(Math.min(fwd,back)===1){step(fwd===1?'next':'prev');return;}
  idx=i;paint();
}
document.getElementById('sbLeft').onclick=()=>step('prev');
const nextButton=document.getElementById('sbRight');
nextButton.setAttribute('aria-label','Resume pages');
nextButton.title='Resume pages';
let storyPlaying=false,storyTimer=null,storyStartTimer=null,storyStartPending=false;
let storyResumeTimer=null;
let hoverDir=null,hoverDelay=null,hoverTimer=null,suppressHoverUntilLeave=false;
const STORY_IDLE_RESUME_MS=3200;
function clearStoryResume(){clearTimeout(storyResumeTimer);storyResumeTimer=null;}
function scheduleStoryResume(){
  clearStoryResume();
  if(idx>=M-1||introOn||storyStartPending)return;
  storyResumeTimer=setTimeout(()=>{
    storyResumeTimer=null;
    if(!storyPlaying&&!introOn&&!hoverDir&&idx<M-1)playStory();
  },STORY_IDLE_RESUME_MS);
}
function stopHoverTurns(){
  const wasHovering=Boolean(hoverDir||hoverDelay||hoverTimer);
  hoverDir=null;clearTimeout(hoverDelay);clearTimeout(hoverTimer);
  hoverDelay=hoverTimer=null;
  if(wasHovering&&!storyPlaying)nextButton.classList.add('start-cue');
}
function hoverDirection(target){
  if(!target||!target.closest)return null;
  if(target.closest('.sb-next,#sbRight'))return 'next';
  if(target.closest('.sb-prev,#sbLeft'))return 'prev';
  return null;
}
function setHoverDirection(dir){
  if(suppressHoverUntilLeave||hoverDir===dir)return;
  stopHoverTurns();
  if(!dir)return;
  if(storyPlaying||storyStartPending)stopStory();
  hoverDir=dir;
  hoverDelay=setTimeout(hoverTurnNext,260);
}
async function hoverTurnNext(){
  if(!hoverDir)return;
  if(turn){hoverTimer=setTimeout(hoverTurnNext,120);return;}
  const dir=hoverDir;
  if((dir==='next'&&idx>=M-1)||(dir==='prev'&&idx<=0)){stopHoverTurns();return;}
  const expected=idx,target=dir==='next'?(idx+1)%M:(idx-1+M)%M;
  try{await ensurePageImage(target);}catch{reportPageLoadError();stopHoverTurns();return;}
  if(!hoverDir||hoverDir!==dir||idx!==expected)return;
  nextButton.classList.remove('start-cue');
  startTurn(dir,0,true,true);
  if(!turn)return;
  tweenTo(1,FLIP_SECONDS,()=>{
    idx=turn.to;turn=null;paint();
    if(hoverDir)hoverTimer=setTimeout(hoverTurnNext,220);
  });
  kick();
}
stage.addEventListener('pointerover',e=>{
  if(e.pointerType==='touch')return;
  setHoverDirection(hoverDirection(e.target));
});
stage.addEventListener('pointerout',e=>{
  if(e.pointerType==='touch')return;
  if(e.relatedTarget)setHoverDirection(hoverDirection(e.relatedTarget));
});
stage.addEventListener('pointerleave',e=>{
  if(e.pointerType==='touch')return;
  suppressHoverUntilLeave=false;stopHoverTurns();

stage.addEventListener('pointerup',()=>{

});
function stopStory(){
  clearStoryResume();

  clearTimeout(storyTimer);clearTimeout(storyStartTimer);storyTimer=storyStartTimer=null;
  nextButton.setAttribute('aria-label','Resume pages');
  nextButton.title='Resume pages';
  nextButton.classList.add('start-cue');
}
function playStory(){
  stopHoverTurns();
  if(storyPlaying){stopStory();scheduleStoryResume();return;}
  clearStoryResume();
  if(idx>=M-1){beginLanding();return;}
  storyStartPending=false;clearTimeout(storyStartTimer);storyStartTimer=null;
  storyPlaying=true;
  nextButton.setAttribute('aria-label','Pause pages');
  nextButton.title='Pause pages';
  nextButton.classList.remove('start-cue');
  setView(0,0,view.tz);

}
function scheduleStoryStart(delay){
  if(!storyStartPending)return;
  clearTimeout(storyStartTimer);
  storyStartTimer=setTimeout(()=>{storyStartPending=false;storyStartTimer=null;playStory();},delay);
}
function finishAutoTurn(){
  if(!turn||!storyPlaying)return;
  const rest=Math.max(.2,1-turn.t);
  tweenTo(1,FLIP_SECONDS*rest,()=>{
    idx=turn.to;turn=null;paint();
    warmNextPage();
    if(storyPlaying)storyTimer=setTimeout(autoTurnNext,PAGE_PAUSE_MS);
  });
  kick();
}
async function autoTurnNext(){
  if(!storyPlaying)return;
  if(idx>=M-1){stopStory();return;}
  const expected=idx;
  try{await ensurePageImage(idx+1);}catch{reportPageLoadError();return;}
  if(!storyPlaying||idx!==expected)return;
  startTurn('next',0,true);
  if(!turn){stopStory();return;}
  if(REDUCED){
    idx=turn.to;turn=null;paint();
    warmNextPage();
    if(storyPlaying)storyTimer=setTimeout(autoTurnNext,PAGE_PAUSE_MS);
    return;
  }
  finishAutoTurn();
}
nextButton.onclick=playStory;
document.getElementById('sbLeft').addEventListener('click',scheduleStoryResume);
addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  e.preventDefault();stopStory();hideHint();
  step(e.key==='ArrowRight'?'next':'prev');
  scheduleStoryResume();
});
/* --------------------------------------------------- loupe + controls */
const loupe=document.getElementById('loupe');
const lens=document.getElementById('loupeLens');
const mag=document.getElementById('loupeMag');
const zRead=document.getElementById('zRead');
const loupeBtn=document.getElementById('loupeBtn');
const zInBtn=document.getElementById('zIn'), zOutBtn=document.getElementById('zOut');
const MAG=2.3;
const DESK=getComputedStyle(document.documentElement).getPropertyValue('--paper').trim()||'#ece7dc';
let loupeOn=true, lx=null, ly=null, lgrab=null, lTarget=null;

function loupeSize(){return Math.round(Math.max(165,Math.min(262,book.clientWidth*0.235)));}
/* the loupe's own coordinate space: stage pixels in live mode (it sits
   outside the book's transform), book pixels otherwise */
function bookBox(){
  return {x:0,y:0,w:book.clientWidth,h:book.clientHeight};
}
/* park it on the desk at the lower right, half off the book */
function restLoupe(){
  const b=bookBox();
  lx=b.x+b.w*0.88; ly=b.y+b.h*0.855;
  placeLoupe();
}
/* The glass sits above the tilt, in the book's untransformed pixels, so the
   lean of the page never nudges it.  What the tilt does change is which part
   of the paper is under the glass, and only the scale matters enough to
   correct for: the book is drawn about its own centre. */
const zoomWrap=document.getElementById('zoomWrap');
const zoomInner=document.getElementById('zoomInner');
/* mirror whatever the book is currently showing into the magnified copy */
function syncZoomLayer(){
  zoomInner.textContent='';
  for(const c of book.children){
    if(c.classList.contains('sb-zone'))continue;      /* hit targets need no copy */
    zoomInner.appendChild(c.cloneNode(true));
  }
}
function placeLoupe(){
  if(lx===null)return;
  const B=bookBox(), bw=B.w, bh=B.h;
  if(!bw)return;
  const R=loupeSize()/2, bez=R*2*0.058;
  loupe.style.setProperty('--lr',R*2+'px');
  loupe.style.transform='translate3d('+(lx-R).toFixed(1)+'px,'+(ly-R).toFixed(1)+'px,0)';
  if(loupeOn)loupe.classList.add('on');

  /* where the paper's edges actually land once the book is scaled */
  const z=view.z, cx=bw/2, cy=bh/2;
  const x0=cx+(bw*.051-cx)*z, x1=cx+(bw*.949-cx)*z;
  const y0=cy+(bh*.218-cy)*z, y1=cy+(bh*.782-cy)*z;
  /* How far the glass's own centre is inside the paper.  The copy fades out
     as it wanders off the sheet, so you are left looking through plain
     glass rather than at a sliver of page on flat desk. */
  const nx=Math.max(x0,Math.min(lx,x1));
  const ny=Math.max(y0,Math.min(ly,y1));
  const inside=(lx>x0&&lx<x1&&ly>y0&&ly<y1)
    ? Math.min(lx-x0, x1-lx, ly-y0, y1-ly)
    : -Math.hypot(lx-nx,ly-ny);
  const k=Math.max(0,Math.min(1,(inside+R*0.30)/(R*0.55)));

  zoomWrap.style.opacity=(loupeOn?k:0).toFixed(3);
  if(k<=0.002)return;
  const r=(R-bez).toFixed(1);
  const mask='radial-gradient(circle '+r+'px at '+lx.toFixed(1)+'px '+ly.toFixed(1)+'px,'
    +'#000 calc(100% - 1px),transparent 100%)';
  zoomWrap.style.webkitMaskImage=mask;
  zoomWrap.style.maskImage=mask;
  /* the page point beneath the glass, magnified about that same spot so the
     lens keeps showing MAG times whatever is on screen */
  const px=cx+(lx-cx)/z, py=cy+(ly-cy)/z, s=MAG*z;
  zoomInner.style.transform='translate('+(lx-px*s).toFixed(1)+'px,'+(ly-py*s).toFixed(1)+'px) '
    +'scale('+s.toFixed(4)+')';
}
/* the leaf shoves the glass aside as it sweeps past */
function shoveLoupe(dir){
  if(!loupeOn||lx===null||lgrab)return;
  const b=bookBox();
  /* which page point the glass covers, once the book's scale is undone */
  const nx=(b.w/2+(lx-b.x-b.w/2)/view.z)/b.w, ny=(b.h/2+(ly-b.y-b.h/2)/view.z)/b.h;
  if(nx<0.02||nx>0.98||ny<0.17||ny>0.83)return;      /* already clear of the page */
  lTarget={x:b.x+b.w*(dir==='next'?0.12:0.88), y:b.y+b.h*0.855};
  kick();
}
function loupeEase(){
  if(!lTarget)return false;
  if(lgrab){lTarget=null;return false;}
  const dx=lTarget.x-lx, dy=lTarget.y-ly;
  if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5){lx=lTarget.x;ly=lTarget.y;lTarget=null;placeLoupe();return false;}
  lx+=dx*0.17;ly+=dy*0.17;placeLoupe();
  return true;
}
loupe.addEventListener('pointerdown',e=>{
  if(!loupeOn||e.button!==0)return;
  e.preventDefault();e.stopPropagation();     /* never starts a page turn */
  lTarget=null;
  lgrab={cx:e.clientX,cy:e.clientY,lx0:lx,ly0:ly};
  loupe.classList.add('held');
  loupe.setPointerCapture(e.pointerId);
  hideHint();
});
loupe.addEventListener('pointermove',e=>{
  if(!lgrab)return;
  const b=bookBox(), R=loupeSize()/2;
  /* the glass carries none of the book's transform, so the cursor maps 1:1 */
  lx=Math.max(b.x-R*0.7,Math.min(b.x+b.w+R*0.7, lgrab.lx0+(e.clientX-lgrab.cx)));
  ly=Math.max(b.y-R*0.7,Math.min(b.y+b.h+R*1.0, lgrab.ly0+(e.clientY-lgrab.cy)));
  placeLoupe();
});
function dropLoupe(){lgrab=null;loupe.classList.remove('held');}
loupe.addEventListener('pointerup',dropLoupe);
loupe.addEventListener('pointercancel',dropLoupe);
loupeBtn.onclick=()=>{
  loupeOn=!loupeOn;
  loupeBtn.setAttribute('aria-pressed',String(loupeOn));
  loupeBtn.setAttribute('aria-label',loupeOn?'Disable magnifier':'Enable magnifier');
  loupeBtn.title=loupeOn?'Disable magnifier':'Enable magnifier';
  loupe.classList.toggle('on',loupeOn);
  if(loupeOn&&lx===null)restLoupe();
};
addEventListener('resize',()=>{lx=null;restLoupe();});

function syncZoom(){
  zRead.textContent=Math.round(view.tz*100)+'%';
  zOutBtn.disabled=view.tz<=ZOOM_MIN+0.001;
  zInBtn.disabled=view.tz>=ZOOM_MAX-0.001;
}
zInBtn.onclick=()=>{setView(view.trx,view.try_,view.tz*1.16);hideHint();};
zOutBtn.onclick=()=>{setView(view.trx,view.try_,view.tz/1.16);hideHint();};

/* ---------------------------------------------------------- the riffle */
let riffle=null,riffleAt=0,introOn=false;
function endIntro(){
  introOn=false;wrap.classList.remove('intro','b2');
}
function riffleStep(){
  const s=riffle[riffleAt];
  wrap.classList.toggle('b2',s.bell>0.55);
  startTurn('next',0);
  tweenTo(1,s.dur,()=>{
    idx=turn.to;turn=null;
    riffleAt++;
    if(introOn&&riffleAt<riffle.length){paint();setTimeout(riffleStep,280);}
    else{endIntro();paint();}
  });
}
function startIntro(){
  /* A small paper-like nudge catches the eye before the first turn. */
  idx=LAND;introOn=false;paint();setView(0,0,view.tz);
  if(!REDUCED){
    wrap.classList.add('attention');
    nextButton.classList.add('start-cue');
    setTimeout(()=>wrap.classList.remove('attention'),1000);
    storyStartPending=true;scheduleStoryStart(1900);
  }
  else hint.querySelector('.sb-hint-secondary').textContent='Drag a page to turn it · Use the arrows to explore · Use the controls to zoom or magnify';
}

/* ------------------------------------------------------------- boot */
(async function boot(){
  idx=Q.has('shot')?(parseInt(Q.get('shot'),10)||0)%M:0;
  applyView();
  try{
    await ensurePageImage(idx);
    paint();
    if(Q.has('t'))await ensurePageImage((idx+1)%M);
    else if(idx<M-1)await ensurePageImage(idx+1);
  }catch{
    paint();reportPageLoadError();
    document.body.dataset.ready='1';
    return;
  }
  if(document.fonts&&document.fonts.ready)await document.fonts.ready.catch(()=>{});
  syncZoom();restLoupe();
  document.body.dataset.ready='1';
  if(Q.has('shot')){
    if(Q.has('t')){startTurn(Q.get('dir')||'next',parseFloat(Q.get('t')));}
    return;
  }
  setTimeout(startIntro,220);
  /* Keep the first view light: the current and next leaf are ready now,
     and warmNextPage() loads each later leaf only as the reader advances. */
})();
</script>
